[project]
name = "stockflow-api"
version = "1.0.0"
description = "RESTful API for inventory management with blockchain-enhanced security"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "marshmallow>=4.3.1",
    "opentimestamps-client>=0.7.2",
    "psycopg2-binary>=2.9.12",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
